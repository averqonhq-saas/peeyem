<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="26" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="118" height="118" rx="25" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Industrial Conveyor Track / Rollers Path -->
  <!-- Left Pulley Roller -->
  <circle cx="38" cy="60" r="16" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="3" />
  <circle cx="38" cy="60" r="7" fill="#38BDF8" />

  <!-- Right Pulley Roller -->
  <circle cx="82" cy="60" r="16" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="3" />
  <circle cx="82" cy="60" r="7" fill="#38BDF8" />

  <!-- Outer Conveyor Belt Loop -->
  <path
    d="M 38 44 L 82 44 A 16 16 0 0 1 98 60 A 16 16 0 0 1 82 76 L 38 76 A 16 16 0 0 1 22 60 A 16 16 0 0 1 38 44 Z"
    fill="none"
    stroke="url(#accent-grad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Chevron Cleat Teeth Markers (Top Strand) -->
  <path d="M 46 41 L 49 44 L 46 47" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 58 41 L 61 44 L 58 47" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 70 41 L 73 44 L 70 47" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Peeyem Letters "P T" Monogram in Center -->
  <g filter="url(#shadow)">
    <path
      d="M 53 53 L 53 67 M 53 53 L 58.5 53 C 61 53 62.5 54.5 62.5 56.5 C 62.5 58.5 61 60 58.5 60 L 53 60"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M 64 53 L 73 53 M 68.5 53 L 68.5 67"
      stroke="#F59E0B"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
